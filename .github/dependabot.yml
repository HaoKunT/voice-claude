version: 2
updates:
  # Rust 后端 (Cargo.toml 在 rust/src-tauri)
  - package-ecosystem: cargo
    directory: /rust/src-tauri
    schedule:
      interval: weekly
      day: monday
    groups:
      minor-patch:
        update-types:
          - minor
          - patch
    open-pull-requests-limit: 5

  # 前端 (pnpm 读 package.json)
  - package-ecosystem: npm
    directory: /rust
    schedule:
      interval: weekly
      day: monday
    groups:
      minor-patch:
        update-types:
          - minor
          - patch
    open-pull-requests-limit: 5

  # GitHub Actions workflow 用到的 actions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
