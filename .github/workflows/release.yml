name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: 发布 tag（如 v0.2.0）
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Release (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            label: macos-arm64
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            label: windows-amd64
    runs-on: ${{ matrix.platform }}
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: rust/pnpm-lock.yaml
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/src-tauri -> target
      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Tauri build + create release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: rust
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseName: "voice-claude ${{ github.event.inputs.tag || github.ref_name }}"
          releaseBody: |
            按一下热键说话，再按一下结束，识别文字自动输入到当前焦点窗口。

            ## 下载

            - **macOS (Apple Silicon)**：`*.dmg` 或 `*.app.tar.gz`
            - **Windows (x64)**：`*.msi` 或 `*-setup.exe`

            > Intel Mac 需本地 `cargo build --target x86_64-apple-darwin` 构建。

            ## macOS 首次使用

            没有 Apple Developer 证书，macOS 会挡下 app。需要在终端运行一条命令解除隔离：

            ```bash
            # 1. 双击 .dmg，把 voice-claude 拖进 Applications
            # 2. 终端执行（绕过 Gatekeeper）：
            xattr -dr com.apple.quarantine /Applications/voice-claude.app
            # 3. 启动
            open /Applications/voice-claude.app
            ```

            启动后：
            1. 弹麦克风权限 → 允许
            2. 系统设置 → 隐私与安全性 → 辅助功能 → `+` → 选 voice-claude → 勾选
            3. 菜单栏图标 → 设置 → 选 ASR 后端填 API Key（或下载本地 SenseVoice 模型）
            4. 默认热键 `Cmd+Shift+F5`：按一下说话，再按一下结束

            ## 已知限制

            - Windows NSPanel 等价尚未实现，悬浮窗会抢焦点（macOS 体验完整）
            - 非 Apple Developer 证书签名，每次重装可能需要重新授权辅助功能
            - 本地 SenseVoice 模型约 1GB，首次下载需稳定网络

            完整变更日志见提交历史。
          releaseDraft: true
          prerelease: true
          args: --target ${{ matrix.target }}

  publish-updater:
    name: Publish latest.json
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # 先把 draft release 转为 published —— 只有 published release 的 asset URL
      # 才稳定指向 releases/download/<tag>/...，draft 期是 untagged-<hash> 随机路径
      - name: Publish release (draft -> published)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: gh release edit "$TAG" --draft=false --prerelease -R HaoKunT/voice-claude
      - name: Generate latest.json and upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: node scripts/gen-latest-json.mjs "$TAG"
