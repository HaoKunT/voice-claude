name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: 发布 tag（如 v0.2.0）
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Release (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            label: macos-arm64
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            label: windows-amd64
    runs-on: ${{ matrix.platform }}
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: rust/pnpm-lock.yaml
      # 不用 Swatinem/rust-cache —— release 频率低(每个版本一次),从 0 build
      # 仅多 3-5 分钟,但避免 cache 假命中(sherpa-onnx-prebuilt 子目录 cache
      # save 时点不一致导致 linker 找不到 dylib)的反复踩坑。CI 跑得勤,
      # cache 留在 ci.yml 即可。
      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Tauri build + create release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: rust
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseName: "voice-claude ${{ github.event.inputs.tag || github.ref_name }}"
          # 下面是 fallback 文案：publish-updater job 会跑 generate-notes
          # 用基于 commit 的自动 changelog 覆盖 body。若那步失败，至少 release
          # 页还有这段最简介绍可看。
          releaseBody: |
            按一下热键说话，再按一下结束，识别文字自动输入到当前焦点窗口。

            > 安装方式、首次使用、已知限制（ad-hoc 签名、TCC 权限）见 [README](https://github.com/HaoKunT/voice-claude#readme)。
          releaseDraft: true
          # 不标 prerelease：否则 GitHub 的 /releases/latest/download/latest.json
          # redirect 不会指向此版本，updater endpoint 取不到 JSON。
          prerelease: false
          # 不传 --target 让 tauri build 走 runner native default target
          # (macos-latest=aarch64-apple-darwin / windows-latest=x86_64-pc-windows-msvc),
          # 产物落到 target/release/ —— 这跟 tauri.conf.json 里 bundle.macOS.files
          # 配的源路径 target/release/lib*.dylib 对齐(传 --target 会让产物去
          # target/<target>/release/,bundle 阶段 copy 找不到 dylib 源)。

  publish-updater:
    name: Publish latest.json
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # 要完整历史和 tag，给 git log / git describe 用
      - uses: actions/setup-node@v6
        with:
          node-version: 20
      # 先把 draft release 转为 published —— 只有 published release 的 asset URL
      # 才稳定指向 releases/download/<tag>/...，draft 期是 untagged-<hash> 随机路径。
      # --latest 强制此 release 为"latest"，updater endpoint 依赖这个 redirect。
      - name: Publish release (draft -> published)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: gh release edit "$TAG" --draft=false --latest -R HaoKunT/voice-claude
      - name: Generate latest.json and upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: node scripts/gen-latest-json.mjs "$TAG"
      # 跑 scripts/gen-release-notes.mjs 按 conventional commit 前缀分组生成
      # changelog（feat / fix / docs / ui / build / ci / refactor），覆盖
      # tauri-action 默认灌的介绍性文案。
      - name: Regenerate release notes from commits
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          PREV_TAG=$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)
          COMPARE_LINE=""
          if [ -n "$PREV_TAG" ]; then
            COMPARE_LINE="**Full Changelog**: https://github.com/HaoKunT/voice-claude/compare/${PREV_TAG}...${TAG}"
          fi
          CHANGELOG=$(node scripts/gen-release-notes.mjs "$TAG")
          BODY=$(cat <<EOF
          按一下热键说话，再按一下结束，识别文字自动输入到当前焦点窗口。

          > 安装方式、首次使用、已知限制（ad-hoc 签名、TCC 权限）见 [README](https://github.com/HaoKunT/voice-claude#readme)。

          ---

          ## What's Changed

          $CHANGELOG

          $COMPARE_LINE
          EOF
          )
          gh release edit "$TAG" -R HaoKunT/voice-claude --notes "$BODY"
