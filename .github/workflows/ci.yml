name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 新 push 自动取消同分支上还在跑的旧 run，避免堆积浪费额度
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ─────────────────────────── Rust + Tauri 主线 ───────────────────────────

  rust-lint:
    name: Rust Lint
    runs-on: macos-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: rust/pnpm-lock.yaml
      # 不用 Swatinem/rust-cache:sherpa-onnx-prebuilt 子目录跟 build.rs dep-info
      # 的 cache save 时点不一致(尤其 cache 在失败 run 中 save 时 prebuilt 不完整),
      # 导致下次 cache hit 时 cargo 跳过 build.rs 重跑、但 prebuilt dylib 缺
      # → linker 找不到 -lsherpa-onnx-c-api。每次重 build sherpa-onnx 多 ~2 分钟,
      # 比反复 debug 假命中划算。release.yml 同样处理。
      - name: Install pnpm deps
        run: pnpm install --frozen-lockfile
      - name: Build frontend (need dist/ for tauri::generate_context)
        run: pnpm build
      - name: cargo fmt --check
        working-directory: rust/src-tauri
        run: cargo fmt --check
      - name: cargo clippy
        working-directory: rust/src-tauri
        run: cargo clippy --all-targets -- -D warnings
      - name: typecheck frontend
        run: pnpm typecheck

  rust-test:
    name: Rust Test
    runs-on: macos-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: rust/pnpm-lock.yaml
      # 不用 Swatinem/rust-cache:sherpa-onnx-prebuilt 子目录跟 build.rs dep-info
      # 的 cache save 时点不一致(尤其 cache 在失败 run 中 save 时 prebuilt 不完整),
      # 导致下次 cache hit 时 cargo 跳过 build.rs 重跑、但 prebuilt dylib 缺
      # → linker 找不到 -lsherpa-onnx-c-api。每次重 build sherpa-onnx 多 ~2 分钟,
      # 比反复 debug 假命中划算。release.yml 同样处理。
      - name: Install pnpm deps
        run: pnpm install --frozen-lockfile
      - name: Build frontend (need dist/ for tauri::generate_context)
        run: pnpm build
      - name: cargo test
        working-directory: rust/src-tauri
        run: cargo test --locked

  # Package job 只在手动触发（workflow_dispatch）时跑，日常 push 不跑以省 CI 额度。
  # 正式发布请打 tag 让 release.yml 跑（tauri-action 一步到位）。
  rust-package:
    name: Rust Package (${{ matrix.platform }})
    if: github.event_name == 'workflow_dispatch'
    needs: [rust-lint, rust-test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            artifact: voice-claude-macos-arm64
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: voice-claude-windows-amd64
    runs-on: ${{ matrix.platform }}
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: rust/pnpm-lock.yaml
      # 不用 Swatinem/rust-cache:sherpa-onnx-prebuilt 子目录跟 build.rs dep-info
      # 的 cache save 时点不一致(尤其 cache 在失败 run 中 save 时 prebuilt 不完整),
      # 导致下次 cache hit 时 cargo 跳过 build.rs 重跑、但 prebuilt dylib 缺
      # → linker 找不到 -lsherpa-onnx-c-api。每次重 build sherpa-onnx 多 ~2 分钟,
      # 比反复 debug 假命中划算。release.yml 同样处理。
      - name: Install frontend deps
        run: pnpm install --frozen-lockfile
      - name: Build (Tauri)
        run: pnpm tauri build --target ${{ matrix.target }}
      - name: Upload macOS bundles
        if: startsWith(matrix.platform, 'macos')
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: |
            rust/src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app
            rust/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
          retention-days: 14
          if-no-files-found: warn
      - name: Upload Windows installer
        if: matrix.platform == 'windows-latest'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: |
            rust/src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            rust/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
          retention-days: 14
          if-no-files-found: warn

  # Go 版（legacy/go/）已归档，不再 CI 验证。
  # 如需手动校验：`make legacy-test / legacy-lint / legacy-vuln`
