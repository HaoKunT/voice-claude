name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # ─────────────────────────── Rust + Tauri 主线 ───────────────────────────

  rust-lint:
    name: Rust Lint
    runs-on: macos-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: rust/pnpm-lock.yaml
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/src-tauri -> target
      - name: Install pnpm deps
        run: pnpm install --frozen-lockfile
      - name: Build frontend (need dist/ for tauri::generate_context)
        run: pnpm build
      - name: cargo fmt --check
        working-directory: rust/src-tauri
        run: cargo fmt --check
      - name: cargo clippy
        working-directory: rust/src-tauri
        run: cargo clippy --all-targets -- -D warnings
      - name: typecheck frontend
        run: pnpm typecheck

  rust-test:
    name: Rust Test
    runs-on: macos-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: rust/pnpm-lock.yaml
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/src-tauri -> target
      - name: Install pnpm deps
        run: pnpm install --frozen-lockfile
      - name: Build frontend (need dist/ for tauri::generate_context)
        run: pnpm build
      - name: cargo test
        working-directory: rust/src-tauri
        run: cargo test --locked

  rust-package:
    name: Rust Package (${{ matrix.platform }})
    if: github.ref == 'refs/heads/main'
    needs: [rust-lint, rust-test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            artifact: voice-claude-macos-arm64
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: voice-claude-windows-amd64
    # macOS Intel（x86_64-apple-darwin）在 GitHub Actions 公共 runner 上队列严重拥堵，
    # 已从 CI 矩阵移除。发布 Intel 版需本地 `cargo build --target x86_64-apple-darwin`
    # 或后续引入 release workflow 触发（release-*.yml，按 tag 构建）。
    runs-on: ${{ matrix.platform }}
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: rust/pnpm-lock.yaml
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/src-tauri -> target
      - name: Install frontend deps
        run: pnpm install --frozen-lockfile
      - name: Build (Tauri)
        run: pnpm tauri build --target ${{ matrix.target }}
      - name: Upload macOS bundles
        if: startsWith(matrix.platform, 'macos')
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            rust/src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app
            rust/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
          retention-days: 14
          if-no-files-found: warn
      - name: Upload Windows installer
        if: matrix.platform == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            rust/src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            rust/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
          retention-days: 14
          if-no-files-found: warn

  # ─────────────────────────── Go + Fyne Legacy（保留到 Rust 版稳定） ────

  go-lint:
    name: Go Lint
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: go mod tidy
        run: go mod tidy && git diff --exit-code
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2

  go-security:
    name: Go Security
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          make go-vuln

  go-test:
    name: Go Test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Test
        run: make go-test
