<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>voice-claude 录音</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: transparent;
        overflow: hidden;
        font-family:
          -apple-system,
          BlinkMacSystemFont,
          "SF Pro Text",
          system-ui,
          sans-serif;
        font-feature-settings: "ss01";
        letter-spacing: -0.01em;
        -webkit-font-smoothing: antialiased;
      }

      .panel {
        position: fixed;
        inset: 6px;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 10px;
        border-radius: 22px;
        background:
          radial-gradient(120% 120% at 50% 0%, rgba(155, 135, 245, 0.12) 0%, transparent 60%),
          radial-gradient(120% 120% at 50% 100%, rgba(255, 92, 92, 0.08) 0%, transparent 60%),
          linear-gradient(180deg, rgba(22, 22, 28, 0.92) 0%, rgba(15, 15, 20, 0.92) 100%);
        box-shadow:
          0 0 0 1px rgba(255, 255, 255, 0.06) inset,
          0 0 0 1px rgba(0, 0, 0, 0.4),
          0 20px 60px rgba(0, 0, 0, 0.5),
          0 0 40px rgba(155, 135, 245, 0.15);
        color: rgba(230, 230, 240, 1);
        -webkit-user-select: none;
        user-select: none;
        overflow: hidden;
      }

      .panel::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 1.5px;
        background: linear-gradient(
          90deg,
          transparent 0%,
          rgba(155, 135, 245, 0.8) 20%,
          rgba(255, 92, 92, 0.8) 50%,
          rgba(125, 211, 252, 0.8) 80%,
          transparent 100%
        );
      }

      canvas {
        width: 460px;
        height: 60px;
      }

      /* 实时识别文字 */
      .partial {
        min-height: 18px;
        max-width: 440px;
        font-size: 13px;
        color: rgba(230, 230, 240, 0.95);
        text-align: center;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        transition: opacity 0.2s;
      }
      .partial.empty {
        opacity: 0.3;
        font-style: italic;
      }

      .bottom {
        display: flex;
        align-items: center;
        justify-content: space-between;
        width: 440px;
        font-size: 11px;
        color: rgba(200, 200, 220, 0.7);
      }

      .status {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .pulse {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #ff5c5c;
        box-shadow: 0 0 8px rgba(255, 92, 92, 0.6);
        animation: pulse 1.4s ease-in-out infinite;
      }

      @keyframes pulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.5; transform: scale(0.8); }
      }

      .timer {
        font-family: "SF Mono", ui-monospace, monospace;
        font-variant-numeric: tabular-nums;
        letter-spacing: 0.02em;
        color: rgba(220, 220, 230, 0.9);
      }

      kbd {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 18px;
        padding: 1px 5px;
        margin: 0 1px;
        background: rgba(255, 255, 255, 0.1);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 3px;
        font-family: "SF Mono", ui-monospace, monospace;
        font-size: 9px;
        color: rgba(220, 220, 230, 1);
      }
    </style>
  </head>
  <body>
    <div class="panel">
      <canvas id="wave" width="920" height="120"></canvas>
      <div class="partial empty" id="partial">等待语音…</div>
      <div class="bottom">
        <div class="status">
          <span class="pulse"></span>
          <span id="status-text">录音中</span>
          <span class="timer" id="timer">00:00</span>
        </div>
        <div style="opacity: 0.8">
          再按 <kbd id="kbd-1">⌘</kbd><kbd id="kbd-2">⇧</kbd><kbd id="kbd-3">F5</kbd> 结束
        </div>
      </div>
    </div>
    <script type="module" src="/src/indicator.tsx"></script>
  </body>
</html>
