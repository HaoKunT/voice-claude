<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>voice-claude 录音</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: transparent;
        overflow: hidden;
        font-family:
          -apple-system,
          BlinkMacSystemFont,
          "SF Pro Text",
          system-ui,
          sans-serif;
        font-feature-settings: "ss01";
        letter-spacing: -0.01em;
        -webkit-font-smoothing: antialiased;
      }

      .panel {
        position: fixed;
        inset: 6px;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 12px;
        border-radius: 22px;
        /* Raycast 风格：深色 + 细腻渐变 + 发光边框 */
        background:
          radial-gradient(120% 120% at 50% 0%, rgba(155, 135, 245, 0.12) 0%, transparent 60%),
          radial-gradient(120% 120% at 50% 100%, rgba(255, 92, 92, 0.08) 0%, transparent 60%),
          linear-gradient(180deg, rgba(22, 22, 28, 0.92) 0%, rgba(15, 15, 20, 0.92) 100%);
        box-shadow:
          0 0 0 1px rgba(255, 255, 255, 0.06) inset,
          0 0 0 1px rgba(0, 0, 0, 0.4),
          0 20px 60px rgba(0, 0, 0, 0.5),
          0 0 40px rgba(155, 135, 245, 0.15);
        color: rgba(230, 230, 240, 1);
        -webkit-user-select: none;
        user-select: none;
        overflow: hidden;
      }

      /* 顶部彩色细光条 Raycast 招牌 */
      .panel::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 1.5px;
        background: linear-gradient(
          90deg,
          transparent 0%,
          rgba(155, 135, 245, 0.8) 20%,
          rgba(255, 92, 92, 0.8) 50%,
          rgba(125, 211, 252, 0.8) 80%,
          transparent 100%
        );
      }

      canvas {
        width: 460px;
        height: 72px;
      }

      .label {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 12px;
        font-weight: 500;
        color: rgba(200, 200, 220, 0.85);
      }

      .pulse {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #ff5c5c;
        box-shadow: 0 0 10px rgba(255, 92, 92, 0.6);
        animation: pulse 1.4s ease-in-out infinite;
      }

      @keyframes pulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.5; transform: scale(0.8); }
      }

      kbd {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 20px;
        padding: 2px 6px;
        margin: 0 1px;
        background: rgba(255, 255, 255, 0.1);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 4px;
        font-family: "SF Mono", ui-monospace, monospace;
        font-size: 10px;
        color: rgba(220, 220, 230, 1);
      }
    </style>
  </head>
  <body>
    <div class="panel">
      <canvas id="wave" width="920" height="144"></canvas>
      <div class="label">
        <span class="pulse"></span>
        <span>正在录音</span>
        <span style="opacity: 0.5">•</span>
        <span style="opacity: 0.7">再按一次</span>
        <kbd>⌘</kbd><kbd>⇧</kbd><kbd>F5</kbd>
        <span style="opacity: 0.7">结束</span>
      </div>
    </div>
    <script type="module" src="/src/indicator.tsx"></script>
  </body>
</html>
