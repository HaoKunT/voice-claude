<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>voice-claude 录音</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: transparent;
        overflow: hidden;
        font-family:
          -apple-system,
          BlinkMacSystemFont,
          "SF Pro Text",
          system-ui,
          sans-serif;
        font-feature-settings: "ss01";
        letter-spacing: -0.01em;
        -webkit-font-smoothing: antialiased;
      }

      .panel {
        position: fixed;
        inset: 6px;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 10px;
        border-radius: 22px;
        background:
          radial-gradient(120% 120% at 50% 0%, rgba(155, 135, 245, 0.12) 0%, transparent 60%),
          radial-gradient(120% 120% at 50% 100%, rgba(255, 92, 92, 0.08) 0%, transparent 60%),
          linear-gradient(180deg, rgba(22, 22, 28, 0.92) 0%, rgba(15, 15, 20, 0.92) 100%);
        box-shadow:
          0 0 0 1px rgba(255, 255, 255, 0.06) inset,
          0 0 0 1px rgba(0, 0, 0, 0.4),
          0 20px 60px rgba(0, 0, 0, 0.5),
          0 0 40px rgba(155, 135, 245, 0.15);
        color: rgba(230, 230, 240, 1);
        -webkit-user-select: none;
        user-select: none;
        overflow: hidden;
      }

      .panel::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 1.5px;
        background: linear-gradient(
          90deg,
          transparent 0%,
          rgba(155, 135, 245, 0.8) 20%,
          rgba(255, 92, 92, 0.8) 50%,
          rgba(125, 211, 252, 0.8) 80%,
          transparent 100%
        );
      }

      canvas {
        width: 460px;
        height: 60px;
      }

      /* 实时识别文字 */
      .partial {
        min-height: 18px;
        max-width: 440px;
        font-size: 13px;
        color: rgba(230, 230, 240, 0.95);
        text-align: center;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        transition: opacity 0.2s;
      }
      .partial.empty {
        opacity: 0.3;
        font-style: italic;
      }

      .bottom {
        display: flex;
        align-items: center;
        justify-content: space-between;
        width: 440px;
        font-size: 11px;
        color: rgba(200, 200, 220, 0.7);
      }

      .status {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .pulse {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #ff5c5c;
        box-shadow: 0 0 8px rgba(255, 92, 92, 0.6);
        animation: pulse 1.4s ease-in-out infinite;
      }

      @keyframes pulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.5; transform: scale(0.8); }
      }

      .timer {
        font-family: "SF Mono", ui-monospace, monospace;
        font-variant-numeric: tabular-nums;
        letter-spacing: 0.02em;
        color: rgba(220, 220, 230, 0.9);
      }

      kbd {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 18px;
        padding: 1px 5px;
        margin: 0 1px;
        background: rgba(255, 255, 255, 0.1);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 3px;
        font-family: "SF Mono", ui-monospace, monospace;
        font-size: 9px;
        color: rgba(220, 220, 230, 1);
      }

      /* 识别结果态（panel output mode 用）—— 可编辑 textarea */
      .result-text {
        width: 440px;
        min-height: 40px;
        max-height: 80px;
        resize: none;
        background: rgba(0, 0, 0, 0.3);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 8px;
        padding: 8px 10px;
        font-size: 13px;
        line-height: 1.5;
        color: rgba(230, 230, 240, 0.95);
        font-family: inherit;
        outline: none;
        box-sizing: border-box;
        transition: border-color 0.15s;
      }
      .result-text:focus {
        border-color: rgba(155, 135, 245, 0.5);
      }

      /* 润色中态 —— spinner + 文字 */
      #processing-view {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
        padding: 20px 0;
      }
      .spinner {
        width: 26px;
        height: 26px;
        border: 3px solid rgba(255, 255, 255, 0.08);
        border-top-color: #b490ff;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      .processing-text {
        font-size: 13px;
        color: rgba(220, 220, 230, 0.85);
      }
      .result-actions {
        display: flex;
        gap: 8px;
        margin-top: 4px;
      }
      .result-actions button {
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 6px;
        padding: 5px 14px;
        color: rgba(220, 220, 230, 0.95);
        font-family: inherit;
        font-size: 12px;
        cursor: pointer;
        transition: all 0.15s;
      }
      .result-actions button:hover {
        background: rgba(255, 255, 255, 0.12);
      }
      .result-actions .btn-primary {
        background: linear-gradient(135deg, #9b87f5, #b490ff);
        border-color: transparent;
        color: white;
      }
      .result-actions .btn-primary:hover {
        opacity: 0.9;
      }
      .result-actions .copied {
        background: rgba(74, 222, 128, 0.15) !important;
        border-color: rgba(74, 222, 128, 0.4) !important;
        color: rgb(134, 239, 172) !important;
      }
    </style>
  </head>
  <body>
    <div class="panel">
      <!-- 录音态 -->
      <div id="recording-view">
        <canvas id="wave" width="920" height="120"></canvas>
        <div class="partial empty" id="partial">等待语音…</div>
        <div class="bottom">
          <div class="status">
            <span class="pulse"></span>
            <span id="status-text">录音中</span>
            <span class="timer" id="timer">00:00</span>
          </div>
          <div style="opacity: 0.8">
            再按 <span id="hotkey-hint"></span> 结束
          </div>
        </div>
      </div>

      <!-- 润色 / 处理中态，默认隐藏 -->
      <div id="processing-view" hidden>
        <div class="spinner"></div>
        <div class="processing-text" id="processing-text">正在处理…</div>
      </div>

      <!-- 已识别态（panel output mode 用），默认隐藏 -->
      <div id="result-view" hidden>
        <textarea class="result-text" id="result-text" spellcheck="false"></textarea>
        <div class="result-actions">
          <button id="result-copy" class="btn-primary">📋 复制</button>
          <button id="result-close">✕ 关闭</button>
        </div>
      </div>
    </div>
    <script type="module" src="/src/indicator.tsx"></script>
  </body>
</html>
