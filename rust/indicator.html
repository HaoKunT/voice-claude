<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>voice-claude 录音</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: transparent;
        overflow: hidden;
        font-family: -apple-system, "PingFang SC", system-ui, sans-serif;
      }
      .panel {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        background: rgba(12, 12, 18, 0.9);
        border-radius: 20px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        color: rgba(200, 200, 220, 1);
        -webkit-user-select: none;
        user-select: none;
      }
      canvas {
        width: 440px;
        height: 60px;
      }
      .label {
        font-size: 13px;
        margin-top: 12px;
        color: rgba(200, 200, 220, 0.9);
      }
    </style>
  </head>
  <body>
    <div class="panel">
      <canvas id="wave" width="880" height="120"></canvas>
      <div class="label">🎙 正在录音…  再按热键结束</div>
    </div>
    <script type="module" src="/src/indicator.tsx"></script>
  </body>
</html>
