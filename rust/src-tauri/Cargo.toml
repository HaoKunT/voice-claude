[package]
name = "voice-claude"
version = "0.1.0"
description = "按住热键，语音输入到当前焦点窗口"
authors = ["tanghaokun"]
edition = "2021"
rust-version = "1.80"

[lib]
name = "voice_claude_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Tauri 核心 + 常用插件
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-store = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"

# 序列化 / 错误
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
anyhow = "1"

# 异步
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"

# HTTP / WebSocket
reqwest = { version = "0.12", features = ["json", "stream", "multipart", "rustls-tls"], default-features = false }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-native-roots"] }

# 签名 / 编码
hmac = "0.12"
sha1 = "0.10"
sha2 = "0.10"
base64 = "0.22"
hex = "0.4"
urlencoding = "2"

# 数据库
rusqlite = { version = "0.32", features = ["bundled"] }

# 日志
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"

# 音频录制
cpal = "0.15"
hound = "3.5"  # WAV 读写

# 键盘模拟
enigo = "0.2"

# 目录
dirs = "5"

# 实用
once_cell = "1"
parking_lot = "0.12"
chrono = { version = "0.4", features = ["serde"] }
url = "2"

# 本地 SenseVoice（离线 ASR）依赖预留：
# sherpa-onnx 1.13 Rust API 和 Go API 差异较大，完整接入作为独立 iteration 完成。
# 启用骨架后默认关闭，Cargo.toml 里保持引用但不 pull crate，避免影响 CI 构建时间。
# 接入步骤见 src/asr/local.rs 开头注释。
#
# [dependencies.sherpa-onnx]
# version = "1.13"
# optional = true

# macOS NSPanel 支持：后续 iteration 通过 tauri-nspanel 接入真·不抢焦点浮窗。
# 现阶段用 Tauri 内置的 always-on-top + skip-taskbar + transparent 组合，视觉效果一致但焦点会抖一下。
# [target.'cfg(target_os = "macos")'.dependencies]
# tauri-nspanel = { git = "https://github.com/ahkohd/tauri-nspanel", branch = "v2" }
# cocoa = "0.26"
# objc = "0.2"
# core-foundation = "0.10"

[features]
default = ["custom-protocol"]
# DO NOT REMOVE!! Tauri 生产模式依赖
custom-protocol = ["tauri/custom-protocol"]
