[package]
name = "voice-claude"
version = "0.1.0"
description = "按住热键，语音输入到当前焦点窗口"
authors = ["tanghaokun"]
edition = "2021"
rust-version = "1.80"

[lib]
name = "voice_claude_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
chrono = "0.4"

[dependencies]
# Tauri 核心 + 常用插件
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-store = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-fs = "2"

# 序列化 / 错误
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
anyhow = "1"

# 异步
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"

# HTTP / WebSocket
reqwest = { version = "0.12", features = ["json", "stream", "multipart", "rustls-tls"], default-features = false }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-native-roots"] }

# 签名 / 编码
hmac = "0.12"
sha1 = "0.10"
sha2 = "0.10"
base64 = "0.22"
hex = "0.4"
urlencoding = "2"

# 数据库
rusqlite = { version = "0.32", features = ["bundled"] }

# 日志
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"

# 音频录制
cpal = "0.15"
hound = "3.5"  # WAV 读写

# 键盘模拟
enigo = "0.2"

# 目录
dirs = "5"

# 实用
once_cell = "1"
parking_lot = "0.12"
chrono = { version = "0.4", features = ["serde"] }
url = "2"

# 本地 SenseVoice（离线 ASR）依赖：
# - sherpa-onnx 走 feature gate `local-asr`，默认关闭（C 库编译时间长）
# - bzip2 + tar 是模型下载 / 解压用，永远启用（download_model 主功能代码不 cfg 切分）
bzip2 = "0.4"
tar = "0.4"

[dependencies.sherpa-onnx]
version = "1.13"
optional = true

# macOS 专用：用 NSPanel 做真·不抢焦点浮窗（对应 type4me 的 FloatingBarPanel 方案）
[target.'cfg(target_os = "macos")'.dependencies]
tauri-nspanel = { git = "https://github.com/ahkohd/tauri-nspanel", branch = "v2" }
objc = "0.2"

[features]
# 默认启用 local-asr：对齐 Go 版的 !nosherpa 发布（带离线 SenseVoice）
default = ["custom-protocol", "local-asr"]
# DO NOT REMOVE!! Tauri 生产模式依赖
custom-protocol = ["tauri/custom-protocol"]
# 本地 SenseVoice 离线 ASR
# 首次编译需下载 + 编译 sherpa-onnx C 库（10-20 分钟），后续增量编译恢复秒级
# 若要禁用：cargo build --no-default-features --features custom-protocol
local-asr = ["dep:sherpa-onnx"]
