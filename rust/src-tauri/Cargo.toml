[package]
name = "voice-claude"
version = "0.3.1"
description = "按住热键，语音输入到当前焦点窗口"
authors = ["tanghaokun"]
edition = "2021"
rust-version = "1.80"

[lib]
name = "voice_claude_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
chrono = "0.4"

[dependencies]
# Tauri 核心 + 常用插件
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-opener = "2"
tauri-plugin-store = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-fs = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

# 序列化 / 错误
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"

# 异步
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"

# HTTP / WebSocket
reqwest = { version = "0.12", features = ["json", "stream", "multipart", "rustls-tls"], default-features = false }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-native-roots"] }

# 签名 / 编码 —— hmac/sha1/sha2 必须三件套同步升级。0.10 用 digest 0.10,
# 0.11 用 digest 0.11,任意一个错档会导致 Hmac<Sha1> 的 trait bound 不满足。
hmac = "0.13"
sha1 = "0.11"
sha2 = "0.11"
base64 = "0.22"
hex = "0.4"
urlencoding = "2"

# 数据库
rusqlite = { version = "0.39", features = ["bundled"] }

# 日志
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"

# 音频录制
cpal = "0.17"
hound = "3.5"  # WAV 读写

# 键盘模拟
enigo = "0.6"

# 目录
dirs = "6"

# 实用
once_cell = "1"
parking_lot = "0.12"
chrono = { version = "0.4", features = ["serde"] }
url = "2"

# 本地 SenseVoice（离线 ASR）依赖：
# - sherpa-onnx 走 feature gate `local-asr`，默认关闭（C 库编译时间长）
# - bzip2 + tar 是模型下载 / 解压用，永远启用（download_model 主功能代码不 cfg 切分）
bzip2 = "0.4"
tar = "0.4"

# 横向 ASR 测试功能(asr/bench.rs)用 —— 解码 wav/mp3/m4a 到 PCM。
# 纯 Rust 解码,不引入 ffmpeg / 系统库依赖。default-features 关掉再 opt-in
# 我们要的格式 + simd,避免拖入一堆没用的 codec(如 vorbis / flac)增大体积。
symphonia = { version = "0.6", default-features = false, features = ["wav", "mp3", "isomp4", "aac", "alac", "pcm"] }
# Audio resampling(rubato 是 Rust 生态里 sinc/polynomial resampler 的事实
# 标准,避免自己手搓线性插值 / anti-aliasing filter)
rubato = "3.0"

[dependencies.sherpa-onnx]
version = "1.13.2"
default-features = false
features = ["shared"]
optional = true

# macOS 专用：用 NSPanel 做真·不抢焦点浮窗（对应 type4me 的 FloatingBarPanel 方案）
[target.'cfg(target_os = "macos")'.dependencies]
tauri-nspanel = { git = "https://github.com/ahkohd/tauri-nspanel", branch = "v2" }
objc = "0.2"
# 跨平台 keyboard hook:替换 tauri-plugin-global-shortcut。原 plugin 注册不了纯
# modifier、拿不到 raw 事件,做不出"双击 RightOption 长按"。handy-keys 是 Handy
# 作者发布的独立 crate(MIT,~2000 行),已封装 macOS CGEventTap 及内部
# modifier reconcile / TapDisabled 自愈,生产已用。
handy-keys = "0.2"

# Windows 专用：
# - window-vibrancy:Mica(Win11) / Acrylic(Win10) 毛玻璃,跟 macOS NSPanel 透明背景对位
# - windows:调 SetWindowLongPtrW 给 indicator 设 WS_EX_NOACTIVATE | WS_EX_TOOLWINDOW,
#   实现 macOS NSPanel 的「不抢焦点」等价行为
[target.'cfg(target_os = "windows")'.dependencies]
window-vibrancy = "0.5"
# windows 0.61 跟 tauri 2 内部依赖对齐 —— tauri::WebviewWindow::hwnd()
# 返回的 HWND 是 0.61 的 InterfaceType 风格,如果我们这里 pin 老版本(0.58)
# 会让调用 GetWindowLongPtrW(hwnd, ...) 出现 type mismatch (CopyType vs InterfaceType)
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
] }
# 同 macOS:替换 tauri-plugin-global-shortcut。Win 端 handy-keys 走
# WH_KEYBOARD_LL,普通用户权限即可。AV 误报问题留到发布前签名/白名单流程处理。
handy-keys = "0.2"

[lints.rust]
# objc 0.2 crate 的 msg_send! / class! 宏内部用了 #[cfg(feature = "cargo-clippy")]，
# 新版 Rust 的 --check-cfg 不认这个 feature，`cargo clippy -D warnings` 下会报
# unexpected_cfgs。给 well-known cfg 显式加上白名单就不再 warn。
# 等 objc 升到 0.3 或迁移 objc2 后可以拆掉。
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("cargo-clippy"))'] }

[features]
# 默认启用 local-asr：对齐 Go 版的 !nosherpa 发布（带离线 SenseVoice）
default = ["custom-protocol", "local-asr"]
# DO NOT REMOVE!! Tauri 生产模式依赖
custom-protocol = ["tauri/custom-protocol"]
# 本地 SenseVoice 离线 ASR
# 首次编译需下载 + 编译 sherpa-onnx C 库（10-20 分钟），后续增量编译恢复秒级
# 若要禁用：cargo build --no-default-features --features custom-protocol
local-asr = ["dep:sherpa-onnx"]
